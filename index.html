<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LedgerOne</title>
  <meta name="description" content="LedgerOne personal finance for iPad, synced with LedgerOne for Windows">
  <meta name="theme-color" content="#f6f6f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LedgerOne">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="Show sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#/home" style="color:inherit;text-decoration:none"><img src="icons/icon-192.png" alt=""><span class="name">LedgerOne</span></a>
    <div class="search"><input id="search" type="search" placeholder="Search all transactions" enterkeyhint="search" autocomplete="off"></div>
    <button class="iconbtn" id="syncBtn" title="Sync with Dropbox"><span class="sync-dot off"></span><span class="label">Sync not set up</span></button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark mode"></button>
  </header>
  <div class="shell">
    <nav id="sidebar" aria-label="Accounts"></nav>
    <main id="main"></main>
  </div>
  <div id="scrim"></div>
  <dialog id="dlg"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
